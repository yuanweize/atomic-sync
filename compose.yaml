name: atomic-sync

services:
  atomic-sync:
    image: ${ATOMIC_IMAGE:-ghcr.io/yuanweize/atomic-sync:0.1.3}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    ports:
      - "${ATOMIC_BIND_ADDR:-127.0.0.1}:${ATOMIC_PORT:-8088}:8080"
    environment:
      TZ: ${TZ:-UTC}
      ATOMIC_LISTEN: ":8080"
      ATOMIC_DATA_DIR: /data
      ATOMIC_RCLONE_BIN: /usr/local/bin/rclone
      ATOMIC_MAX_CONCURRENCY: ${ATOMIC_MAX_CONCURRENCY:-2}
      ATOMIC_RCLONE_TRANSFERS: ${ATOMIC_RCLONE_TRANSFERS:-2}
      ATOMIC_RCLONE_CHECKERS: ${ATOMIC_RCLONE_CHECKERS:-2}
      ATOMIC_RCLONE_TPS_LIMIT: ${ATOMIC_RCLONE_TPS_LIMIT:-2}
      ATOMIC_LOG_FORMAT: json
      ATOMIC_API_TOKEN: ${ATOMIC_API_TOKEN:?set ATOMIC_API_TOKEN in .env}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - type: bind
        source: ${ATOMIC_STATE_PATH:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${RCLONE_CONFIG_DIR:-./rclone}
        target: /config/rclone
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${ATOMIC_SOURCE_PATH:-./source}
        target: /sources/media
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/ready"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
