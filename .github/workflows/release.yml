name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.25.12"
  REGISTRY: ghcr.io

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Require the tag commit to belong to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release metadata
        id: release
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vMAJOR.MINOR.PATCH"; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "candidate=${REGISTRY}/${GITHUB_REPOSITORY,,}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push isolated candidate image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.release.outputs.built_at }}
          tags: ${{ steps.release.outputs.candidate }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.built_at }}
          provenance: mode=max,version=v1
          sbom: true

      - name: Verify per-platform SBOM and provenance
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          reference="${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect --format '{{ json .SBOM }}' "$reference" \
            | jq -e '
                (."linux/amd64".SPDX.SPDXID == "SPDXRef-DOCUMENT") and
                (."linux/arm64".SPDX.SPDXID == "SPDXRef-DOCUMENT")
              ' >/dev/null
          docker buildx imagetools inspect --format '{{ json .Provenance }}' "$reference" \
            | jq -e '
                ((."linux/amd64".SLSA.buildDefinition.buildType | type) == "string") and
                ((."linux/amd64".SLSA.buildDefinition.buildType | length) > 0) and
                ((."linux/amd64".SLSA.runDetails.builder.id | type) == "string") and
                ((."linux/amd64".SLSA.runDetails.builder.id | length) > 0) and
                ((."linux/arm64".SLSA.buildDefinition.buildType | type) == "string") and
                ((."linux/arm64".SLSA.buildDefinition.buildType | length) > 0) and
                ((."linux/arm64".SLSA.runDetails.builder.id | type) == "string") and
                ((."linux/arm64".SLSA.runDetails.builder.id | length) > 0)
              ' >/dev/null

      - name: Scan candidate amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
          timeout: 10m0s

      - name: Scan candidate arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
          timeout: 10m0s
          skip-setup-trivy: true

      - name: Verify anonymous GHCR candidate access
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          package="${GITHUB_REPOSITORY#*/}"
          docker logout ghcr.io
          if ! resolved="$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "$CANDIDATE")"; then
            settings="https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package,,}/settings"
            echo "::error title=GHCR package is not public::Anonymous manifest access failed. Set the package visibility to Public in GitHub Packages, then rerun this workflow."
            echo "Package settings: ${settings}"
            exit 1
          fi
          if [[ "$resolved" != "$DIGEST" ]]; then
            echo "::error title=Candidate digest mismatch::${CANDIDATE} resolved to ${resolved}, expected ${DIGEST}."
            exit 1
          fi

      - name: Log back in to GHCR for signing
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify signature
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          reference="${IMAGE}@${DIGEST}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify "$reference" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

      - name: Build release binaries and checksums
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ steps.release.outputs.built_at }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/yuanweize/atomic-sync/internal/buildinfo.Version=${VERSION} -X github.com/yuanweize/atomic-sync/internal/buildinfo.Commit=${COMMIT} -X github.com/yuanweize/atomic-sync/internal/buildinfo.Date=${BUILD_DATE}" \
              -o "dist/atomic-sync_${VERSION}_linux_${arch}" ./cmd/atomic-sync
          done
          cd dist
          sha256sum atomic-sync_* > SHA256SUMS

      - name: Record immutable image digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > dist/image-digest.txt

      - name: Promote verified digest to release tags
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${IMAGE}@${DIGEST}"

      - name: Verify public release tags resolve to the signed digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          docker logout ghcr.io
          for tag in "$VERSION" latest "sha-${GITHUB_SHA}"; do
            reference="${IMAGE}:${tag}"
            resolved="$(docker buildx imagetools inspect --format '{{ .Manifest.Digest }}' "$reference")"
            if [[ "$resolved" != "$DIGEST" ]]; then
              echo "::error title=Release tag digest mismatch::${reference} resolved to ${resolved}, expected ${DIGEST}."
              exit 1
            fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Atomic Sync $GITHUB_REF_NAME"
