name: Verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.12"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        run: go tool cover -func=coverage.out | awk '/total:/ { gsub("%", "", $3); if ($3 + 0 < 65) { print "coverage " $3 "% is below 65%"; exit 1 } }'

      - name: Check frontend syntax
        run: node --check internal/api/ui/app.js

      - name: Validate Compose models
        env:
          ATOMIC_API_TOKEN: ${{ github.sha }}
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          yq -e '.services["atomic-sync"] as $service | ([$service.volumes[] | select(.type == "bind")] | length == 3)' compose.yaml
          yq -e '.services["atomic-sync"] as $service | ([$service.volumes[] | select(.type == "bind" and .target == "/data" and .bind.create_host_path == false)] | length == 1)' compose.yaml
          yq -e '.services["atomic-sync"] as $service | ([$service.volumes[] | select(.type == "bind" and .target == "/config/rclone" and .bind.create_host_path == false)] | length == 1)' compose.yaml
          yq -e '.services["atomic-sync"] as $service | ([$service.volumes[] | select(.type == "bind" and .target == "/sources/media" and .bind.create_host_path == false)] | length == 1)' compose.yaml
          docker compose version
          compose_json="$(docker compose config --format json)"
          jq -e '
            .services["atomic-sync"] as $service |
            {
              root_read_only: ($service.read_only == true),
              fixed_user: ($service.user == "1000:1000"),
              all_caps_dropped: (($service.cap_drop // []) | index("ALL") != null),
              no_new_privileges: (($service.security_opt // []) | any(. == "no-new-privileges:true" or . == "no-new-privileges=true")),
              rclone_config_path: ($service.environment.RCLONE_CONFIG == "/config/rclone/rclone.conf"),
              config_rw_bind: ([$service.volumes[] | select(.type == "bind" and .target == "/config/rclone" and (.read_only // false) == false and ((.bind.create_host_path // false) == false))] | length == 1),
              source_ro_bind: ([$service.volumes[] | select(.type == "bind" and .target == "/sources/media" and .read_only == true and ((.bind.create_host_path // false) == false))] | length == 1),
              writable_targets_exact: ([$service.volumes[] | select((.read_only // false) == false) | .target] | sort == ["/config/rclone", "/data"])
            } as $checks |
            $checks,
            ($checks | to_entries | all(.value == true))
          ' <<<"$compose_json"

      - name: Check and build hardened image
        run: |
          docker build --check .
          docker build --tag atomic-sync:test --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} .

      - name: Verify rclone token-refresh boundary
        run: |
          set -Eeuo pipefail
          config_dir="$(mktemp -d)"
          source_dir="$(mktemp -d)"
          cleanup() {
            sudo rm -rf "$config_dir" "$source_dir"
          }
          trap cleanup EXIT

          sudo chown 1000:1000 "$config_dir"
          sudo chmod 0700 "$config_dir"
          sudo chmod 0777 "$source_dir"
          printf '[GD]\ntype = drive\n' | sudo tee "$config_dir/rclone.conf" >/dev/null
          sudo chown 1000:1000 "$config_dir/rclone.conf"
          sudo chmod 0600 "$config_dir/rclone.conf"

          docker run --rm --read-only --user 1000:1000 \
            --mount "type=bind,src=$config_dir,dst=/config/rclone" \
            --mount "type=bind,src=$source_dir,dst=/sources/media,readonly" \
            --entrypoint /bin/sh atomic-sync:test -ec '
              cp /config/rclone/rclone.conf /config/rclone/rclone.conf.tmp
              mv /config/rclone/rclone.conf /config/rclone/rclone.conf.old
              mv /config/rclone/rclone.conf.tmp /config/rclone/rclone.conf
              rm /config/rclone/rclone.conf.old
              ! touch /sources/media/forbidden
              ! touch /home/atomic/rootfs-forbidden
            '

      - name: Smoke-test image
        run: |
          set -Eeuo pipefail

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Atomic Sync smoke-test diagnostics"
              docker ps --all --filter name=atomic-sync-ci || true
              docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} error={{json .State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' atomic-sync-ci || true
              docker inspect --format '{{range .State.Health.Log}}{{println .Start "exit=" .ExitCode "output=" .Output}}{{end}}' atomic-sync-ci || true
              docker logs --timestamps atomic-sync-ci || true
              echo "::endgroup::"
            fi
            docker rm --force atomic-sync-ci >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run --detach --name atomic-sync-ci \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000,mode=0750 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18088:8080 \
            --env ATOMIC_API_TOKEN=${{ github.sha }} \
            atomic-sync:test

          ready_status=unavailable
          health_status=starting
          container_status=created
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18088/api/ready >/dev/null 2>&1; then
              ready_status=ready
            else
              ready_status=unavailable
            fi
            container_status="$(docker inspect --format '{{.State.Status}}' atomic-sync-ci)"
            health_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' atomic-sync-ci)"

            if [ "$ready_status" = ready ] && [ "$health_status" = healthy ]; then
              echo "Atomic Sync became ready and healthy after ${attempt}s"
              break
            fi
            case "$container_status" in
              dead|exited|removing)
                echo "::error::Atomic Sync container entered terminal state: $container_status"
                break
                ;;
            esac
            if [ "$attempt" -eq 1 ] || [ $((attempt % 10)) -eq 0 ]; then
              echo "Waiting for Atomic Sync: attempt=$attempt ready=$ready_status health=$health_status container=$container_status"
            fi
            sleep 1
          done

          if [ "$ready_status" != ready ] || [ "$health_status" != healthy ]; then
            echo "::error::Atomic Sync did not become ready and healthy within 90 seconds (ready=$ready_status health=$health_status container=$container_status)"
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:18088/api/health | grep '"status":"ok"'
          test "$(docker inspect --format '{{.State.Health.Status}}' atomic-sync-ci)" = healthy
          test "$(docker exec atomic-sync-ci id -u)" = 1000
          test "$(docker exec atomic-sync-ci awk '/CapEff/ {print $2}' /proc/1/status)" = 0000000000000000
          test "$(docker exec atomic-sync-ci /usr/local/bin/rclone version | sed -n '1p')" = "rclone 1.74.4"
          for command in check copy lsf lsjson moveto; do
            docker exec atomic-sync-ci /usr/local/bin/rclone "$command" --help >/dev/null
          done
          ! docker exec atomic-sync-ci /usr/local/bin/rclone purge --help >/dev/null 2>&1
          test "$(docker exec atomic-sync-ci /usr/local/bin/rclone help backends | grep -Ec '^  (local|crypt|drive) +')" = 3

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: atomic-sync:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
