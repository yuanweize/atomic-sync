name: Verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.12"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        run: go tool cover -func=coverage.out | awk '/total:/ { gsub("%", "", $3); if ($3 + 0 < 65) { print "coverage " $3 "% is below 65%"; exit 1 } }'

      - name: Check frontend syntax
        run: node --check internal/api/ui/app.js

      - name: Validate Compose models
        env:
          ATOMIC_API_TOKEN: ${{ github.sha }}
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet

      - name: Check and build hardened image
        run: |
          docker build --check .
          docker build --tag atomic-sync:test --build-arg VERSION=ci --build-arg COMMIT=${{ github.sha }} .

      - name: Smoke-test image
        run: |
          docker run --detach --name atomic-sync-ci \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000,mode=0750 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18088:8080 \
            --env ATOMIC_API_TOKEN=${{ github.sha }} \
            atomic-sync:test
          trap 'docker logs atomic-sync-ci; docker rm --force atomic-sync-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18088/api/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18088/api/health | grep '"status":"ok"'
          test "$(docker inspect --format '{{.State.Health.Status}}' atomic-sync-ci)" = healthy
          test "$(docker exec atomic-sync-ci id -u)" = 1000
          test "$(docker exec atomic-sync-ci awk '/CapEff/ {print $2}' /proc/1/status)" = 0000000000000000

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: atomic-sync:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
